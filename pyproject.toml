[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "past-hermes"
version = "0.1.1"
description = "past.dev memory for Hermes Agent: recall before each turn, conversations kept in past."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://past.dev"

[project.entry-points."hermes_agent.memory_providers"]
past = "past_hermes"

[tool.setuptools]
packages = ["past_hermes"]

[tool.setuptools.package-data]
past_hermes = ["plugin.yaml"]
